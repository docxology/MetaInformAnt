# METAINFORMANT Amalgkit Configuration
# Species: Polistes fuscatus (Paper wasp)
# NCBI Taxonomy ID: 30207
# Assembly: GCF_000220695.1
# Note: Added for Hymenoptera cross-species tissue comparisons (brain, fast body, ovary)

work_dir: output/amalgkit/polistes_fuscatus/work
log_dir: output/amalgkit/polistes_fuscatus/logs
threads: 16

auto_install_amalgkit: true

filters:
  require_tissue: false

species_list:
  - Polistes_fuscatus

taxon_id: 30207

genome:
  accession: GCF_000220695.1
  dest_dir: output/amalgkit/polistes_fuscatus/genome

  include:
    - genome           
    - gff3            
    - rna             
    - cds             
    - protein         

  ftp_url: https://ftp.ncbi.nlm.nih.gov/genomes/all/GCF/000/220/695/GCF_000220695.1/
  files:
    genomic_fasta: GCF_000220695.1_genomic.fna.gz
    transcriptome_fasta: GCF_000220695.1_rna_from_genomic.fna.gz
    cds_fasta: GCF_000220695.1_cds_from_genomic.fna.gz
    protein_fasta: GCF_000220695.1_protein.faa.gz
    annotation_gff: GCF_000220695.1_genomic.gff.gz

steps:
  metadata:
    out_dir: output/amalgkit/polistes_fuscatus/work
    search_string: '"Polistes fuscatus"[Organism] AND RNA-Seq[Strategy] AND Illumina[Platform]'
    redo: no
  integrate:
    fastq_dir: output/amalgkit/polistes_fuscatus/fastq/getfastq
  select:
    select_rules_tsv: config/amalgkit/select_rules.tsv
  getfastq:
    out_dir: output/amalgkit/polistes_fuscatus/fastq
    remove_sra: yes
    threads: 16
    redo: no
  quant:
    out_dir: output/amalgkit/polistes_fuscatus/quant
    threads: 16
    redo: no
    clean_fastq: no
  merge:
    out_dir: output/amalgkit/polistes_fuscatus/work
  wsfilter:
    out_dir: output/amalgkit/polistes_fuscatus/work
    input_dir: output/amalgkit/polistes_fuscatus/work/merge
    norm: log2p1-fpkm
    mapping_rate: 0.2
  finalize:
    out_dir: output/amalgkit/polistes_fuscatus/work
    input_dir: output/amalgkit/polistes_fuscatus/work/wsfilter
    norm: log2p1-fpkm
    batch_effect_alg: no
  sanity: {}
