# METAINFORMANT Amalgkit Configuration
# Species: Dinoponera quadriceps
# NCBI Taxonomy ID: 609295
# Assembly: GCF_001313825.1 (ASM131382v1)
# Assembly Level: Scaffold
# Sequencing: Illumina
# Annotation: NCBI Dinoponera quadriceps Annotation Release 100
# Annotation Release: 100
# Notes: Giant queenless ant, largest known ant species
# RNA-seq Samples Available: 13
# Generated: 2026-02-09

# Paths are resolved relative to repository root
work_dir: output/amalgkit/dinoponera_quadriceps/work
log_dir: output/amalgkit/dinoponera_quadriceps/logs
threads: 16

auto_install_amalgkit: true

# Pre-selection filtering rules
filters:
  require_tissue: false

# Species configuration
species_list:
  - Dinoponera_quadriceps

taxon_id: 609295

# Reference genome configuration — shared genome directory
genome:
  accession: GCF_001313825.1
  assembly_name: ASM131382v1
  annotation_release: 100
  dest_dir: output/amalgkit/shared/genome/Dinoponera_quadriceps
  include:
    - genome
    - gff3
    - rna
    - cds
    - protein
  ftp_url: https://ftp.ncbi.nlm.nih.gov/genomes/all/GCF/001/313/825/GCF_001313825.1_ASM131382v1/
  files:
    genomic_fasta: GCF_001313825.1_ASM131382v1_genomic.fna.gz
    transcriptome_fasta: GCF_001313825.1_ASM131382v1_rna_from_genomic.fna.gz
    cds_fasta: GCF_001313825.1_ASM131382v1_cds_from_genomic.fna.gz
    protein_fasta: GCF_001313825.1_ASM131382v1_protein.faa.gz
    annotation_gff: GCF_001313825.1_ASM131382v1_genomic.gff.gz

# Per-step parameters
steps:
  metadata:
    out_dir: output/amalgkit/dinoponera_quadriceps/work
    search_string: '"Dinoponera quadriceps"[Organism] AND "RNA-Seq"[Strategy] AND "Illumina"[Platform]'
    redo: no
  integrate:
    fastq_dir: output/amalgkit/dinoponera_quadriceps/fastq/getfastq
  select:
    select_rules_tsv: config/amalgkit/select_rules.tsv
  getfastq:
    out_dir: output/amalgkit/dinoponera_quadriceps/fastq
    threads: 16
    redo: no
    aws: yes
    gcp: no
    ncbi: no
    fastp: no
    max_bp: 50000000
  quant:
    out_dir: output/amalgkit/dinoponera_quadriceps/work
    threads: 16
    redo: no
    build_index: no
    clean_fastq: no
    index_dir: output/amalgkit/shared/genome/Dinoponera_quadriceps/index
    fasta_dir: output/amalgkit/shared/genome/Dinoponera_quadriceps
  merge:
    out_dir: output/amalgkit/dinoponera_quadriceps/work
  wsfilter:
    out_dir: output/amalgkit/dinoponera_quadriceps/work
    input_dir: output/amalgkit/dinoponera_quadriceps/work/merge
    norm: log2p1-fpkm
    mapping_rate: 0.2
  finalize:
    out_dir: output/amalgkit/dinoponera_quadriceps/work
    input_dir: output/amalgkit/dinoponera_quadriceps/work/wsfilter
    norm: log2p1-fpkm
    batch_effect_alg: no
  sanity: {}
