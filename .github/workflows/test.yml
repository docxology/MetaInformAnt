name: Test Suite

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:
    inputs:
      test_type:
        description: 'Test type to run'
        required: false
        default: 'all'
        type: choice
        options:
          - all
          - fast
          - network
          - external

env:
  PYTHONUNBUFFERED: 1
  UV_CACHE_DIR: ~/.cache/uv

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ["3.11", "3.12"]
        test-type: [fast]
        include:
          # Add network tests on Ubuntu only
          - os: ubuntu-latest
            python-version: "3.12"
            test-type: network
          # Add external tool tests on Ubuntu only
          - os: ubuntu-latest
            python-version: "3.12"
            test-type: external
          # Full test suite on Ubuntu with latest Python
          - os: ubuntu-latest
            python-version: "3.12"
            test-type: all

    steps:
    - name: Checkout code
      uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

    - name: Install uv
      uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
      with:
        version: "latest"
        enable-cache: true
        cache-dependency-glob: "**/pyproject.toml"

    - name: Set up Python ${{ matrix.python-version }}
      run: uv python install ${{ matrix.python-version }}

    - name: Install system dependencies (Ubuntu)
      if: runner.os == 'Linux'
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          muscle \
          seqkit \
          sra-toolkit \
          build-essential \
          zlib1g-dev

    - name: Install system dependencies (macOS)
      if: runner.os == 'macOS'
      run: |
        brew update
        brew tap brewsci/bio || true
        brew install seqkit || true
        brew install sratoolkit || true
        brew install brewsci/bio/muscle || true

    - name: Setup test environment
      if: runner.os == 'macOS'
      run: |
        echo "Setting up macOS test environment for type: ${{ matrix.test-type }}"
        # The fast macOS matrix does not exercise the optional louvain/igraph
        # stack; avoid its platform-specific source build while retaining the
        # same Python and core/scientific test contract.
        bash scripts/package/setup.sh --python "${{ matrix.python-version }}" --skip-amalgkit --skip-tests

    - name: Setup test environment with Amalgkit
      if: runner.os != 'macOS'
      run: |
        echo "Setting up test environment for type: ${{ matrix.test-type }}"
        bash scripts/package/setup.sh --python "${{ matrix.python-version }}" --skip-tests

    - name: Verify test setup
      run: |
        bash scripts/package/verify.sh --mode setup

    - name: Run tests
      run: |
        case "${{ matrix.test-type }}" in
          "fast")
            bash scripts/package/test.sh --mode fast
            ;;
          "network")
            bash scripts/package/test.sh --mode network
            ;;
          "external")
            bash scripts/package/test.sh --mode external
            ;;
          "all")
            bash scripts/package/test.sh --mode coverage
            ;;
          *)
            bash scripts/package/test.sh --mode all
            ;;
        esac

    - name: Upload coverage reports
      if: matrix.test-type == 'all' && matrix.os == 'ubuntu-latest' && matrix.python-version == '3.12'
      uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v6.0.2
      with:
        file: ./output/coverage.xml
        flags: unittests
        name: codecov-umbrella
        fail_ci_if_error: false

    - name: Upload test artifacts
      if: failure()
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
      with:
        name: test-results-${{ matrix.os }}-${{ matrix.python-version }}-${{ matrix.test-type }}
        path: |
          output/
          !output/**/.git/
        retention-days: 7

  test-infrastructure:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

    - name: Install uv
      uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
      with:
        version: "latest"

    - name: Set up Python 3.12
      run: uv python install 3.12

    - name: Setup test environment
      run: bash scripts/package/setup.sh --python 3.12 --skip-tests

    - name: Test test infrastructure
      run: uv run pytest tests/infrastructure/test_test_infrastructure.py -v

  quality-checks:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

    - name: Install uv
      uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
      with:
        version: "latest"

    - name: Set up Python 3.12
      run: uv python install 3.12

    - name: Setup development environment
      run: |
        uv venv --python 3.12
        source .venv/bin/activate
        uv pip install -e ".[dev]"
        mkdir -p output

    - name: Run code quality checks
      run: |
        source .venv/bin/activate
        black --check --diff src/ tests/ scripts/
        isort --check-only --diff src/ tests/ scripts/
        flake8 src/ tests/ --max-line-length=120 --extend-ignore=E203,W503
        # Script entrypoints intentionally bootstrap src before package imports;
        # Black/isort cover their formatting while F/E9 remains blocking.
        flake8 scripts/ --select=F,E9 --max-line-length=120 --extend-ignore=E203,W503
        python scripts/quality/check_mypy_budget.py src/metainformant/rna

    - name: Run security checks
      run: |
        source .venv/bin/activate
        # Medium-and-higher severity findings block CI. Low-severity findings
        # are retained for a separate baseline review rather than hidden.
        bandit -r src/ --severity-level medium -f json -o output/security_report.json
        # NLTK's import guard rejects the repository working directory during
        # Safety startup in the hosted editable-install environment. Run the
        # module from a neutral directory with Python's safe-path flag while
        # retaining the editable project's src path in the environment scan.
        (cd /tmp && python -P -m safety check --output json) > output/safety_report.json

  test-examples:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

    - name: Install uv
      uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
      with:
        version: "latest"
        enable-cache: true
        cache-dependency-glob: "**/pyproject.toml"

    - name: Set up Python 3.12
      run: uv python install 3.12

    - name: Setup test environment
      run: bash scripts/package/setup.sh --python 3.12 --skip-tests

    - name: Run example tests
      run: |
        uv run python scripts/test_examples/test_examples.py --junit-xml

    - name: Publish Test Results
      uses: EnricoMi/publish-unit-test-result-action@283dea176069279a9076e77b548668a8e4f0c31b # v2.9.0
      if: always()
      with:
        files: output/examples/junit_report.xml

    - name: Upload example test artifacts
      if: failure()
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
      with:
        name: example-test-results-${{ github.run_id }}
        path: |
          output/examples/
          !output/examples/**/*.png
          !output/examples/**/*.pdf
        retention-days: 7

  fat-filesystem-test:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

    - name: Install uv
      uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
      with:
        version: "latest"

    - name: Set up Python 3.12
      run: uv python install 3.12

    - name: Create FAT-like filesystem simulation
      run: |
        # Simulate FAT filesystem limitations using tmpfs
        # Copy only essential source files (exclude .git, output, .venv, etc.)
        sudo mkdir -p /mnt/fat_test
        sudo mount -t tmpfs -o size=4g,nr_inodes=50000 tmpfs /mnt/fat_test
        rsync -rl --exclude='.git' --exclude='output' --exclude='.venv' --exclude='.uv-cache' --exclude='node_modules' . /mnt/fat_test/

    - name: Test on simulated FAT filesystem
      run: |
        cd /mnt/fat_test
        # Keep the constrained filesystem test focused on package setup; the
        # normal matrix jobs validate the Amalgkit source/runtime contract.
        bash scripts/package/setup.sh --python 3.12 --skip-amalgkit --skip-tests
        bash scripts/package/test.sh --mode fast

  summary:
    runs-on: ubuntu-latest
    needs: [test, test-infrastructure, quality-checks, test-examples, fat-filesystem-test]
    if: always()
    steps:
    - name: Test Summary
      run: |
        echo "Test Results Summary:"
        echo "- Test jobs (fast + extended): ${{ needs.test.result }}"
        echo "- Infrastructure tests: ${{ needs.test-infrastructure.result }}"
        echo "- Quality checks: ${{ needs.quality-checks.result }}"
        echo "- Example tests (required): ${{ needs.test-examples.result }}"
        echo "- FAT filesystem test: ${{ needs.fat-filesystem-test.result }}"

        # All matrix test types, infrastructure tests, and quality checks are required.
        if [[ "${{ needs.test.result }}" != "success" ]] || \
           [[ "${{ needs.test-infrastructure.result }}" != "success" ]] || \
           [[ "${{ needs.quality-checks.result }}" != "success" ]] || \
           [[ "${{ needs.test-examples.result }}" != "success" ]]; then
          echo "Core checks failed"
          exit 1
        fi

        # The FAT-like filesystem job is an informational environment probe;
        # the normal matrix remains the required portability contract.
        if [[ "${{ needs.fat-filesystem-test.result }}" != "success" ]]; then
          echo "Notice: FAT filesystem test is informational: ${{ needs.fat-filesystem-test.result }}"
        fi

        echo "All required checks passed"
