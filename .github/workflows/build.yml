name: Build Package

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Build type to run'
        required: false
        default: 'all'
        type: choice
        options:
          - all
          - wheel-only
          - sdist-only
          - check-only

env:
  PYTHONUNBUFFERED: 1

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
    - name: Checkout code
      uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

    - name: Install uv
      uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
      with:
        version: "latest"
        enable-cache: true
        cache-dependency-glob: "**/pyproject.toml"

    - name: Set up Python ${{ matrix.python-version }}
      run: uv python install ${{ matrix.python-version }}

    - name: Install build tools
      run: |
        uv tool install build
        uv tool install twine

    - name: Build package
      run: |
        case "${{ github.event.inputs.build_type || 'all' }}" in
          "wheel-only")
            bash scripts/package/build.sh --wheel-only
            ;;
          "sdist-only")
            bash scripts/package/build.sh --sdist-only
            ;;
          "check-only")
            bash scripts/package/build.sh --check
            ;;
          *)
            bash scripts/package/build.sh --check
            ;;
        esac

    - name: Validate package structure
      run: |
        # Check that dist directory was created
        if [ ! -d "dist" ]; then
          echo "ERROR: dist directory not found"
          exit 1
        fi

        # List built artifacts
        echo "Built artifacts:"
        ls -la dist/

        # Check for expected files
        if [ "${{ github.event.inputs.build_type || 'all' }}" != "check-only" ]; then
          # Should have at least one wheel or sdist
          if ! ls dist/*.whl dist/*.tar.gz >/dev/null 2>&1; then
            echo "ERROR: No wheel or sdist files found in dist/"
            exit 1
          fi
        fi

    - name: Test package installation
      run: |
        # Create a temporary virtual environment for testing
        uv venv --python "${{ matrix.python-version }}" test_install

        # Install the built package
        if ls dist/*.whl >/dev/null 2>&1; then
          uv pip install --python test_install/bin/python dist/*.whl
        elif ls dist/*.tar.gz >/dev/null 2>&1; then
          uv pip install --python test_install/bin/python dist/*.tar.gz
        else
          echo "ERROR: No package files to install"
          exit 1
        fi

        # Test basic import
        test_install/bin/python -c "import metainformant; print(f'Successfully imported metainformant {metainformant.__version__}')"

        # Test CLI
        test_install/bin/metainformant --help > /dev/null

        # Clean up
        rm -rf test_install

    - name: Run build validation tests
      run: |
        # Run our custom build validation tests
        uv run --with pytest --with pytest-timeout pytest tests/infrastructure/test_build.py -v

    - name: Upload build artifacts
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
      with:
        name: metainformant-${{ matrix.python-version }}-${{ github.sha }}
        path: |
          dist/
          !dist/**/.git/
        retention-days: 30

  build-validation:
    runs-on: ubuntu-latest
    needs: build
    steps:
    - name: Checkout code
      uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

    - name: Download build artifacts
      uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
      with:
        name: metainformant-3.12-${{ github.sha }}
        path: dist/

    - name: Install uv
      uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
      with:
        version: "latest"

    - name: Set up Python 3.12
      run: uv python install 3.12

    - name: Install package and test
      run: |
        # Test installation in clean environment
        uv venv --python 3.12 validation_env

        # Install from wheel
        if ls dist/*.whl >/dev/null 2>&1; then
          uv pip install --python validation_env/bin/python dist/*.whl
        else
          echo "ERROR: No wheel found for validation"
          exit 1
        fi

        # Run comprehensive validation
        validation_env/bin/python -c "
        import metainformant as mi
        print(f'✓ Import successful: {mi.__version__}')

        # Test core functionality
        from metainformant.core import io
        print('✓ Core IO import successful')

        # Test CLI
        import subprocess
        result = subprocess.run(['validation_env/bin/metainformant', '--version'], capture_output=True, text=True)
        if result.returncode == 0:
            print('✓ CLI works')
        else:
            print('✗ CLI failed')
            exit(1)
        "

        # Clean up
        rm -rf validation_env

  summary:
    runs-on: ubuntu-latest
    needs: [build, build-validation]
    if: always()
    steps:
    - name: Build Summary
      run: |
        echo "Build Summary:"
        echo "- Build job: ${{ needs.build.result }}"
        echo "- Validation job: ${{ needs.build-validation.result }}"

        if [[ "${{ needs.build.result }}" == "success" ]] && \
           [[ "${{ needs.build-validation.result }}" == "success" ]]; then
          echo "✅ All build checks passed"
        else
          echo "❌ Some build checks failed"
          exit 1
        fi
