name: Release

on:
  release:
    types: [published]
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      release_type:
        description: 'Release type'
        required: true
        default: 'test'
        type: choice
        options:
          - test
          - production

env:
  PYTHONUNBUFFERED: 1

jobs:
  release-validation:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.get_version.outputs.version }}
      is_prerelease: ${{ steps.get_version.outputs.is_prerelease }}

    steps:
    - name: Checkout code
      uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

    - name: Install uv
      uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
      with:
        version: "latest"

    - name: Set up Python 3.12
      run: uv python install 3.12

    - name: Get version info
      id: get_version
      run: |
        # Extract version from pyproject.toml
        VERSION=$(grep '^version = ' pyproject.toml | sed 's/version = "\(.*\)"/\1/')
        echo "version=$VERSION" >> $GITHUB_OUTPUT

        # Check if prerelease (contains alpha, beta, rc)
        if [[ "$VERSION" =~ (alpha|beta|rc) ]]; then
          echo "is_prerelease=true" >> $GITHUB_OUTPUT
        else
          echo "is_prerelease=false" >> $GITHUB_OUTPUT
        fi

        echo "Version: $VERSION"

  build-release:
    runs-on: ubuntu-latest
    needs: release-validation

    steps:
    - name: Checkout code
      uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

    - name: Install uv
      uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
      with:
        version: "latest"
        enable-cache: true
        cache-dependency-glob: "**/pyproject.toml"

    - name: Set up Python 3.12
      run: uv python install 3.12

    - name: Install build tools
      run: |
        uv tool install build
        uv tool install twine

    - name: Build distribution packages
      run: bash scripts/package/build.sh --check

    - name: Validate packages
      run: |
        # List built packages
        echo "Built packages:"
        ls -la dist/

        # Validate with twine
        twine check dist/*.whl dist/*.tar.gz

    - name: Upload build artifacts
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
      with:
        name: release-artifacts
        path: |
          dist/
          !dist/**/.git/
        retention-days: 30

  build-docs:
    runs-on: ubuntu-latest
    needs: release-validation

    steps:
    - name: Checkout code
      uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

    - name: Install uv
      uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
      with:
        version: "latest"

    - name: Set up Python 3.12
      run: uv python install 3.12

    - name: Install development dependencies
      run: |
        uv venv
        source .venv/bin/activate
        uv pip install -e ".[dev]"
        mkdir -p docs/_build docs/_static docs/_templates

    - name: Build documentation
      run: |
        source .venv/bin/activate
        test -f scripts/package/uv_docs.sh
        bash scripts/package/uv_docs.sh build

    - name: Build PDF documentation (optional)
      run: |
        source .venv/bin/activate
        # Try to build PDF if LaTeX is available
        if command -v pdflatex &> /dev/null; then
          bash scripts/package/uv_docs.sh build --format pdf
        else
          echo "LaTeX not available, skipping PDF build"
        fi

    - name: Upload documentation
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
      with:
        name: documentation
        path: |
          docs/_build/
          !docs/_build/**/.git/
        retention-days: 30
        if-no-files-found: error

  install-smoke:
    runs-on: ubuntu-latest
    needs: build-release
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
    - name: Checkout code
      uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

    - name: Install uv
      uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
      with:
        version: "latest"

    - name: Download build artifacts
      uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
      with:
        name: release-artifacts
        path: dist/

    - name: Run clean wheel smoke test
      run: |
        wheel=$(find dist -maxdepth 1 -name '*.whl' -print -quit)
        test -n "$wheel"
        bash scripts/package/smoke_install.sh "$wheel" "${{ matrix.python-version }}"

  publish-test:
    runs-on: ubuntu-latest
    needs: [release-validation, build-release, install-smoke]
    if: github.event.inputs.release_type == 'test' || needs.release-validation.outputs.is_prerelease == 'true'

    steps:
    - name: Download build artifacts
      uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
      with:
        name: release-artifacts
        path: dist/

    - name: Publish to TestPyPI
      env:
        TWINE_USERNAME: __token__
        TWINE_PASSWORD: ${{ secrets.TEST_PYPI_API_TOKEN }}
      run: |
        uv tool install twine
        twine upload --repository testpypi dist/*

  publish-production:
    runs-on: ubuntu-latest
    needs: [release-validation, build-release, build-docs, install-smoke]
    if: github.event_name == 'release' && needs.release-validation.outputs.is_prerelease == 'false' && github.event.inputs.release_type != 'test'

    steps:
    - name: Download build artifacts
      uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
      with:
        name: release-artifacts
        path: dist/

    - name: Download documentation
      uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
      with:
        name: documentation
        path: docs-build/

    - name: Publish to PyPI
      env:
        TWINE_USERNAME: __token__
        TWINE_PASSWORD: ${{ secrets.PYPI_API_TOKEN }}
      run: |
        uv tool install twine
        twine upload dist/*

    - name: Create GitHub release assets
      if: github.event_name == 'release'
      uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
      with:
        files: |
          dist/*.whl
          dist/*.tar.gz
        generate_release_notes: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  deploy-docs:
    runs-on: ubuntu-latest
    needs: [release-validation, build-docs]
    if: github.event_name == 'release' && needs.release-validation.outputs.is_prerelease == 'false'

    steps:
    - name: Download documentation
      uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
      with:
        name: documentation
        path: docs-build/

    - name: Deploy to GitHub Pages
      uses: peaceiris/actions-gh-pages@84c30a85c19949d7eee79c4ff27748b70285e453 # v4.1.0
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        publish_dir: docs-build/html
        cname: docs.metainformant.org  # Optional: if you have a custom domain

  summary:
    runs-on: ubuntu-latest
    needs: [release-validation, build-release, build-docs, publish-test, publish-production, deploy-docs]
    if: always()

    steps:
    - name: Release Summary
      run: |
        echo "Release Summary for version ${{ needs.release-validation.outputs.version }}:"
        echo "- Release validation: ${{ needs.release-validation.result }}"
        echo "- Build release: ${{ needs.build-release.result }}"
        echo "- Build docs: ${{ needs.build-docs.result }}"
        echo "- TestPyPI publish: ${{ needs.publish-test.result }}"
        echo "- PyPI publish: ${{ needs.publish-production.result }}"
        echo "- Docs deploy: ${{ needs.deploy-docs.result }}"

        if [[ "${{ needs.release-validation.result }}" == "success" ]] && \
           [[ "${{ needs.build-release.result }}" == "success" ]]; then
          echo "✅ Release build successful"
          if [[ "${{ needs.publish-production.result }}" == "success" ]]; then
            echo "✅ Production release completed"
          elif [[ "${{ needs.publish-test.result }}" == "success" ]]; then
            echo "✅ Test release completed"
          fi
        else
          echo "❌ Release failed"
          exit 1
        fi
