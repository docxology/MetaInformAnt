name: Security Checks

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

env:
  PYTHONUNBUFFERED: 1

permissions:
  contents: read

jobs:
  security-checks:
    # BLOCKING GATE: this job must pass before merge. Failures are resolved
    # either by a source fix or by a dated, owned entry in
    # scripts/package/security_baseline.txt documenting the accepted finding.
    name: Blocking security and dependency checks
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Install uv
      uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      with:
        version: "latest"
        enable-cache: true
        cache-dependency-glob: |
          **/pyproject.toml
          **/uv.lock

    - name: Set up Python 3.14
      run: uv python install 3.14

    - name: Run blocking security checks
      run: bash scripts/package/security_checks.sh

    - name: Upload security reports
      if: always()
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: security-reports-${{ github.run_id }}
        path: |
          output/security_bandit.json
          output/security_pip_audit.json
          output/security_pattern_audit.txt
          output/security_pattern_traversal.txt
        if-no-files-found: warn
