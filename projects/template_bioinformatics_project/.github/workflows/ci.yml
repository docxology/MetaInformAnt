name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Test pipeline (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.14", "3.15"]
    env:
      UV_PYTHON: ${{ matrix.python-version }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "latest"

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync --extra dev

      - name: Generate synthetic data
        run: uv run scripts/99_create_synthetic_data.py --n-samples 40 --seed 1

      - name: Run Stage 1 (process)
        run: uv run scripts/01_process_data.py --force

      - name: Run Stage 2 (analyze)
        run: uv run scripts/02_analyze_results.py --force

      - name: Run Stage 3 (visualize)
        run: uv run scripts/03_visualize.py --force

      - name: Run test suite
        run: uv run pytest tests/ -v --tb=short

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: results-${{ matrix.python-version }}
          path: |
            results/
            logs/
          retention-days: 7
